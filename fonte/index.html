<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f4d3a">
<title>Prumo Planta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/*LEAFLET_CSS*/
:root{--verde:#1f4d3a;--verde2:#2f6f55;--claro:#eef4f0;--borda:#d5ddd8;--txt:#1c2421;--sub:#5d6b65;--alerta:#b3541e;--bg:#f6f8f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{background:var(--verde);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none}
header b{font-size:16px}
header #hproj{margin-left:auto;font-size:13px;opacity:.9;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-croqui.on{display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--borda)}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12px;color:var(--sub);font-weight:600}
nav button.on{color:var(--verde);box-shadow:inset 0 3px 0 var(--verde)}
.pad{padding:14px;max-width:820px;margin:0 auto}
h2{font-size:16px;margin:18px 0 8px}
h2:first-child{margin-top:0}
p{margin:6px 0;line-height:1.45}
.sub{color:var(--sub);font-size:13px}
.card{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
button.b{border:1px solid var(--borda);background:#fff;border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--txt)}
button.b.p{background:var(--verde);border-color:var(--verde);color:#fff}
button.b.d{color:#a12a2a}
button.b:disabled{opacity:.45}
button.b.sm{padding:6px 9px;font-size:13px}
label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:10px 0 3px}
input[type=text],input[type=search],select{width:100%;border:1px solid var(--borda);border-radius:8px;padding:9px 10px;font-size:16px;background:#fff;color:var(--txt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid var(--borda);background:var(--claro);border-radius:14px;padding:4px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:9px 4px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--verde);color:#fff}
.aviso{background:#fdf1e7;border:1px solid #f0cfae;color:#7a3b12;border-radius:8px;padding:9px 11px;margin:8px 0;font-size:13.5px}
.ok{background:var(--claro);border:1px solid #cfe0d6;border-radius:8px;padding:9px 11px;margin:8px 0;font-size:13.5px}
/* croqui */
#cqwrap{flex:1;min-height:0;position:relative;background:#fff}
#cq{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#cqbar{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#cqbar button{pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#cqzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#cqzoom button{width:40px;height:40px;padding:0;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#cqsel{flex:none;background:#fff;border-top:1px solid var(--borda);padding:8px 10px;display:none}
#cqsel.on{display:block}
#cqvazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--sub);pointer-events:none}
/* mapa */
#mapwrap{position:relative;height:58vh;min-height:300px;border-radius:10px;overflow:hidden;border:1px solid var(--borda);background:#223}
#map{position:absolute;inset:0}
#mira{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:500}
#mira:before,#mira:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#mira:before{left:16px;top:0;width:2px;height:34px}
#mira:after{top:16px;left:0;height:2px;width:34px}
.vx{background:#ffd400;border:2px solid #000;border-radius:50%}
.ladon{background:#000c;color:#fff;font-size:12px;font-weight:700;border-radius:10px;text-align:center;line-height:20px}
#maptools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border:1px solid var(--borda);padding:6px 8px;text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
th{background:var(--claro);font-size:12.5px}
tr.tot td{font-weight:700;background:#fafcfb}
.lado input{width:84px;padding:5px 7px;font-size:15px}
.plantabox{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:6px}
.plantabox svg{display:block;width:100%;height:auto;max-height:70vh}
/* folha / modal */
#sheetbg{position:fixed;inset:0;background:#0007;display:none;z-index:2000;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
#sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px 20px;max-height:88vh;overflow:auto}
#sheet h3{margin:0 0 6px;font-size:17px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fotos div{position:relative}
.fotos img{width:74px;height:74px;object-fit:cover;border-radius:8px;display:block}
.fotos i{position:absolute;right:-5px;top:-5px;background:#a12a2a;color:#fff;border-radius:50%;width:20px;height:20px;font-style:normal;text-align:center;line-height:20px;font-size:13px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1c2421;color:#fff;padding:9px 14px;border-radius:20px;font-size:13.5px;z-index:3000;display:none;max-width:90%;text-align:center}
/* AR */
#ar{position:fixed;inset:0;display:none;z-index:4000}
#ar.on{display:block}
#arcv{position:absolute;inset:0;width:100%;height:100%}
#artop{position:absolute;left:10px;right:10px;top:12px;background:#000a;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;text-align:center}
#arbot{position:absolute;left:10px;right:10px;bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#arbot button{padding:14px 6px;font-size:15px;border-radius:12px;border:0;font-weight:700;background:#fffe;color:#111}
#arbot button.p{background:#ffd400;grid-column:1/3;padding:18px}
/* impressão */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{height:auto;background:#fff;display:block}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:10pt;color:#000}
  #print .ptop{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px}
  #print .ptop b{font-size:14pt}
  #print .pgrid{display:grid;grid-template-columns:1fr 78mm;gap:6mm}
  #print svg{width:100%;height:150mm;border:1px solid #000}
  #print table{font-size:8.5pt}
  #print td,#print th{border:1px solid #000;padding:2px 5px}
  #print th{background:#e8e8e8}
  #print .nota{font-size:7.5pt;margin-top:4px;line-height:1.3}
  #print h4{margin:8px 0 3px;font-size:9.5pt}
}
</style>
</head>
<body>
<header><b>Prumo Planta</b><span id="hproj"></span></header>
<main>
  <section class="view" id="v-proj"><div class="pad" id="projbody"></div></section>
  <section class="view" id="v-croqui">
    <div id="cqwrap">
      <svg id="cq"></svg>
      <div id="cqvazio"></div>
      <div id="cqbar">
        <button class="b p" id="bAdd">+ Cômodo</button>
        <button class="b" id="bAR">Medir com AR</button>
      </div>
      <div id="cqzoom"><button class="b" id="bZin">+</button><button class="b" id="bZout">−</button><button class="b" id="bZfit" title="Enquadrar">⤢</button></div>
    </div>
    <div id="cqsel"></div>
  </section>
  <section class="view" id="v-cont"><div class="pad" id="contbody"></div></section>
  <section class="view" id="v-planta"><div class="pad" id="plantabody"></div></section>
</main>
<nav>
  <button data-v="proj">Projetos</button>
  <button data-v="croqui">1 · Croqui</button>
  <button data-v="cont">2 · Contorno</button>
  <button data-v="planta">3 · Planta</button>
</nav>
<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="ar">
  <canvas id="arcv"></canvas>
  <div id="artop"></div>
  <div id="arbot">
    <button class="p" id="arMark">Marcar canto</button>
    <button id="arUndo">Desfazer</button>
    <button id="arClose">Fechar cômodo</button>
    <button id="arEnd" style="grid-column:1/3;background:#fff9">Concluir e voltar ao croqui</button>
  </div>
</div>
<div id="print"></div>
<input type="file" id="fFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fImp" accept=".json,application/json" hidden>
<script>/*LEAFLET_JS*/</script>
<script>/*GEO_JS*/</script>
<script>/*APP_JS*/</script>
</body>
</html>
