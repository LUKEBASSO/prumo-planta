name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar as telas do app para dentro do APK
        run: cp index.html android/app/src/main/assets/www/index.html

      - name: Compilar
        run: |
          set -o pipefail
          gradle -p android assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publicar o APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrumoPlanta.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk PrumoPlanta.apk --title "Prumo Planta - APK" --notes "Versão gerada do commit ${GITHUB_SHA::7}. Baixe o PrumoPlanta.apk no celular e instale." --latest
          gh release delete build-log -y --cleanup-tag || true

      - name: Publicar o log de erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log -y --cleanup-tag || true
          tail -c 60000 build.log > build-log.txt || echo "sem log" > build-log.txt
          gh release create build-log build-log.txt --title "Log de compilação (falhou)" --notes "Erro ao compilar ${GITHUB_SHA::7}" --prerelease
